
name: Build Roby App iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Préparer les fichiers web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet iOS
        run: npx cap add ios

      - name: Synchroniser le projet
        run: npx cap sync ios

      - name: Compiler l’application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
