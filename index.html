
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roby App</title>
<style>
body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: linear-gradient(145deg, #111827, #4338ca);
  color: white;
  min-height: 100vh;
  display: grid;
  place-items: center;
}
main {
  text-align: center;
  padding: 30px;
}
.logo {
  font-size: 70px;
}
button {
  border: 0;
  border-radius: 15px;
  padding: 15px 24px;
  font-size: 17px;
  margin: 8px;
}
#message {
  margin-top: 20px;
  font-size: 18px;
}
</style>
</head>
<body>
<main>
  <div class="logo">🚀</div>
  <h1>Roby App</h1>
  <p>Mon premier projet iPhone !</p>
  <button onclick="bonjour()">Démarrer</button>
  <button onclick="couleur()">Changer le fond</button>
  <p id="message">Bienvenue !</p>
</main>
<script>
function bonjour() {
  document.getElementById("message").textContent =
    "Salut Roby ! Ton application fonctionne 🎉";
}
function couleur() {
  document.body.style.background =
    "linear-gradient(145deg, #064e3b, #0891b2)";
}
</script>
</body>
</html>
